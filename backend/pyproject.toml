[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verbatim-ai"
version = "1.0.0"
description = "Verbatim AI — Premium Local AI Transcription & Audio Conversion Application"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Verbatim AI Contributors" }
]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.0.0",
    "huggingface-hub>=0.20.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
